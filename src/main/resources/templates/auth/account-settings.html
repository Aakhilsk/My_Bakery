<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Account Settings - MyBakery</title></head>
<body><main>
    <a th:href="@{/admin/products}">Back to Admin</a>
    <h1>Account Settings</h1>
    <p th:if="${usernameError}" th:text="${usernameError}" role="alert"></p>
    <p th:if="${passwordError}" th:text="${passwordError}" role="alert"></p>

    <section><h2>Change Username</h2>
        <form th:action="@{/auth/change-username}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <p>Current username: <strong th:text="${currentUser.username}"></strong></p>
            <label for="newUsername">New username</label><input id="newUsername" name="newUsername" pattern="[A-Za-z0-9_]{3,}" required>
            <label for="passwordForUsername">Current password</label><input id="passwordForUsername" name="passwordForUsername" type="password" required>
            <button type="submit">Change Username</button>
        </form>
    </section>
    <section><h2>Change Password</h2>
        <form th:action="@{/auth/change-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" required>
            <label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" minlength="12" required>
            <label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="12" required>
            <button type="submit">Change Password</button>
        </form>
    </section>
    <section><h2>Two-factor authentication</h2><a th:href="@{/auth/mfa/setup}">Set up or view MFA</a></section>
</main></body></html>
