# ============================================
# MyBakery Application Configuration
# ============================================

# Server port (default 8080)
server.port=${PORT:8080}

# --- Database Connection ---
# Render and other cloud providers set PORT automatically.
# If no datasource environment variables are provided, the app falls back to an embedded H2 database for local development.
# For deployment, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, and optionally SPRING_DATASOURCE_DRIVER.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:mybakery;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# --- JPA / Hibernate ---
# update = create or update schema without dropping data; validate is better for production
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Thymeleaf ---
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# --- File upload limits ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Logging ---
logging.level.org.hibernate.SQL=WARN
logging.level.com.mybakery=INFO
